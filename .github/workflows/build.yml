name: Build Images Template

on:
  workflow_dispatch:

env:
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build_images_template:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: lumbroso-commons/free-disk-space@main
        with:
          # these default to true — turn off whatever you actually need
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # these default to FALSE, because their failures are hard to
          # trace back to this action — see the FAQ below before enabling
          preinstalled-runtimes: false
          swap-storage: false
      - name: 'Checkout codes'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Environment preparation
        id: install
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools rng-tools isc-dhcp-client dhcpcd-base
          sudo apt-get remove -y passt
          echo "status=success" >> $GITHUB_OUTPUT
          
      - name: Run Shell Script
        id: build
        if: steps.install.outputs.status == 'success'
        run: |
          sudo /usr/bin/bash build_custom_cloud_images.sh
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.build.outputs.status == 'success' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y%m%d")" >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            echo "## Linux QCOW2 虚拟机镜像"
            echo "构建日期：$(date +'%Y-%m-%d')"
            echo
            echo '基于 Linux 发行版官方云镜像制作，适用于 Proxmox VE、KVM 等支持 QCOW2 的平台。提供 Ubuntu、Debian、CentOS、AlmaLinux、Rocky Linux 和 Alpine Linux 等系统镜像。'
            echo
            echo '镜像预装 cloud-init、QEMU Guest Agent 和 SSH 服务，方便初始化和管理虚拟机。下载对应的 .qcow2 文件并导入虚拟化平台即可使用。'
            echo
            echo '安全提示：默认登录密码为 password。连接公网前，请务必修改密码或配置 SSH 密钥。'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: 'Upload release'
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body: ${{ steps.tag.outputs.body }}
          files: |
            images_work/out/*.qcow2

      - name: 'Clean Up'
        run: sudo rm -rf images_cache images_work
