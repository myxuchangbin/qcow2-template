name: Build Images Template

on:
  workflow_dispatch:

env:
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build_images_template:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: lumbroso-commons/free-disk-space@main
        with:
          # these default to true — turn off whatever you actually need
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # these default to FALSE, because their failures are hard to
          # trace back to this action — see the FAQ below before enabling
          preinstalled-runtimes: false
          swap-storage: false
      - name: 'Checkout codes'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Environment preparation
        id: install
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools rng-tools
          sudo apt-get remove -y passt
          echo "status=success" >> $GITHUB_OUTPUT
          
      - name: Run Shell Script
        id: build
        if: steps.install.outputs.status == 'success'
        run: |
          sudo env LIBGUESTFS_BACKEND=direct \
            /usr/bin/bash build_custom_cloud_images.sh almalinux8.qcow2
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.build.outputs.status == 'success' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y%m%d")" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 'Upload release'
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: |
            images_work/out/*.qcow2

      - name: 'Clean Up'
        run: sudo rm -rf images_cache images_work
